# Small: the Tiny recipe with a wider and deeper encoder.
extends = "../vq_baseline.toml"

[model]
encoder_stem_channels = 64
encoder_intermediate_channels = 128
encoder_channels = 512
encoder_blocks = 3
latent_dim = 64
codebook_size = 128

[train]
output_dir = "outputs/model_scale"

[tracking]
run_name = "vq_scale_small"
