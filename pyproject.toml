[project]
name = "kobeni"
version = "0.1.0"
description = "Controlled experiments for discrete spatial visual vocabularies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "optuna>=5.0.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
kobeni = "kobeni.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
